name: Terminal checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and terminal integration tests
        run: python -m unittest discover -s tests -v
      - name: Verify package installation
        run: python -m pip install .
      - name: Verify installed entry point
        run: cazimi --version
      - name: Offline automated research demonstration
        run: python -m cazimi.demo --workspace .cazimi/ci-demo
