[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cazimi-terminal"
version = "0.1.0"
description = "Automated equity thesis research with branchable state and an audit ledger"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
cazimi = "cazimi.cli:main"
dao = "dao.cli:main"

[tool.setuptools.packages.find]
include = ["dao*", "cazimi*"]
